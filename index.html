<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>멜로MR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..800;1,400..800&family=Inter:wght@400..700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600&text=%EB%A9%9C%EB%A1%9C&display=swap" rel="stylesheet">
<link rel="preload" href="PretendardVariable.subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="InterNum.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* 글꼴: 한글·본문 Pretendard / 영어 제목 Playfair Display / 숫자·가격 Inter (모두 SIL OFL 1.1) */
@font-face{font-family:"Pretendard";src:url("PretendardVariable.subset.woff2") format("woff2-variations"),url("PretendardVariable.subset.woff2") format("woff2");font-weight:45 920;font-display:swap}
/* InterNum: 숫자와 가격 기호만 담은 Inter. 글꼴 목록 맨 앞에 두어 모든 숫자가 Inter로 보입니다 */
@font-face{font-family:"InterNum";src:url("InterNum.woff2") format("woff2-variations"),url("InterNum.woff2") format("woff2");font-weight:100 900;font-display:swap;unicode-range:U+0030-0039,U+002C,U+002E,U+0025,U+002B,U+002F,U+003A,U+0024,U+20A9,U+00D7,U+2013}
:root{
  /* 흰 바탕 + 파스텔 라벤더. 단일 라이트 테마(브랜드 세계관 고정). */
  /* 레이아웃: 스튜디오 히어로 → 기능 3열 → 라벤더 톤 작업실형 웹앱 → 요금제 → 결제·문의 → 주문(데모) → FAQ */
  --bg:#ffffff; --lav-50:#f8f6ff; --lav-100:#f1ecff; --lav-200:#e4dbff; --lav-300:#cfc2ff;
  --line:rgba(91,64,214,.12); --line-2:rgba(91,64,214,.22);
  --ink:#1c1933; --muted:#5d5980; --dim:#8d89ad;
  --violet:#6d4dff; --violet-2:#8467ff; --lav:#a48bff; --orchid:#d264e6; --amber:#d99a0b; --rose:#e5486d; --indigo:#6b7cf2;
  --f-T:#b8a5ff; --f-S:#8fa0ff; --f-D:#ee9cf8; --f-X:#f7c64c;
  --sans:"InterNum","Pretendard",-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --num:"Inter","InterNum","Pretendard",system-ui,sans-serif;
  --display:var(--sans); --body:var(--sans); --mono:var(--sans);
  color-scheme:light;
}
:root:lang(zh-CN){--sans:"InterNum","Pretendard","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--violet)}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.18}
:root:lang(en) h1,:root:lang(en) .sec-head h2,:root:lang(en) .hero-feats h3,:root:lang(en) .plan h3{font-family:var(--serif);letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.wrap-wide{max-width:1360px;margin:0 auto;padding:0 24px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--violet)}
:root:lang(en) .eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:12px}
.demo-tag{white-space:nowrap;flex:none;display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.04em;color:#a06a00;background:#fff4d6;border-radius:5px;padding:1px 7px;line-height:1.55;vertical-align:middle}
.soon{display:inline-block;font-size:10px;font-weight:600;color:var(--dim);background:var(--lav-100);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:1px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 22px;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .15s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--violet);color:#fff;box-shadow:0 10px 26px rgba(109,77,255,.28)}
.btn-primary:hover{background:var(--violet-2)}
.btn-ghost{background:var(--lav-100);color:var(--ink)}
.btn-ghost:hover{background:var(--lav-200)}
.btn-sm{padding:8px 14px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:default}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--lav-100);color:var(--muted)}
.pill.pro{background:var(--violet);color:#fff}
.pill.wait{background:#fff4d6;color:#a06a00}
.pill.ok{background:var(--lav-200);color:#4b2fd6}

/* nav */
nav.top{position:fixed;top:0;left:0;right:0;z-index:40;transition:background .2s}
nav.top.solid{background:rgba(255,255,255,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav.top .wrap-wide{display:flex;align-items:center;gap:22px;height:68px}
.logo{font-family:"Playfair Display","Noto Serif KR",Georgia,serif;font-weight:600;font-size:24px;letter-spacing:-.005em;color:var(--ink);text-decoration:none}
.logo span{color:var(--violet);font-style:italic;font-weight:500;margin-left:.03em}
.navlinks{display:flex;gap:26px;margin-left:auto}
.navlinks a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500}
.navlinks a:hover{color:var(--ink)}
.langsw{display:inline-flex;gap:2px;background:var(--lav-100);border-radius:999px;padding:3px}
.langsw button{background:none;border:0;border-radius:999px;padding:4px 10px;cursor:pointer;color:var(--muted);font-weight:700;font-size:12px}
.langsw button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(28,25,51,.12)}
.auth{display:flex;align-items:center;gap:8px}
.auth .who{font-size:13px;color:var(--muted);max-width:10em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:900px){.navlinks a.hide-md{display:none}}
@media (max-width:640px){.navlinks{display:none}.langsw{margin-left:auto}.auth .who{display:none}.auth .btn-ghost{display:none}}

/* hero */
.hero{position:relative;overflow:hidden;padding:150px 0 72px;isolation:isolate;background:linear-gradient(180deg,var(--lav-50),#fff 85%)}
.hero-bg{position:absolute;top:0;right:0;bottom:0;width:66%;z-index:-2;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 42%);mask-image:linear-gradient(90deg,transparent 0%,#000 42%)}
.hero-bg img{width:100%;height:100%;object-fit:cover;object-position:65% 40%;filter:brightness(1.18) saturate(.75) contrast(.92)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:
  linear-gradient(90deg,#fff 0%,rgba(255,255,255,.97) 38%,rgba(255,255,255,.55) 60%,rgba(255,255,255,.08) 82%,rgba(255,255,255,.18) 100%),
  linear-gradient(180deg,rgba(248,246,255,0) 60%,#fff 100%),
  radial-gradient(50% 60% at 85% 25%,rgba(164,139,255,.28),transparent 70%)}
.hero .en-title{font-family:var(--serif);font-size:clamp(44px,7vw,96px);font-weight:500;letter-spacing:-.015em;line-height:1.02;margin:18px 0 6px;color:var(--ink)}
.hero .en-title i{font-style:italic;color:var(--violet)}
.hero h1{font-size:clamp(28px,4.2vw,54px);font-weight:500;letter-spacing:-.035em;line-height:1.2;max-width:14em;color:var(--ink)}
:root:lang(en) .hero h1{font-family:var(--sans);letter-spacing:-.03em}
.hero h1 em{font-style:normal;background:linear-gradient(100deg,var(--violet) 0%,var(--lav) 50%,var(--orchid) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{color:var(--muted);font-size:clamp(17px,1.5vw,19px);max-width:34em;margin:24px 0 34px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero-meta{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.hero-feats{margin-top:92px;display:grid;grid-template-columns:repeat(3,1fr);gap:48px;border-top:1px solid var(--line);padding-top:34px}
.hero-feats .k{font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--violet)}
.hero-feats h3{font-size:21px;font-weight:600;letter-spacing:-.02em;margin:10px 0 6px}
.hero-feats p{margin:0;color:var(--muted);font-size:15px;max-width:30em}
.img-credit{position:absolute;right:24px;bottom:18px;font-size:11px;color:var(--dim)}
@media (max-width:820px){.hero{padding:120px 0 56px}.hero-bg{width:100%;-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 30%,transparent 62%);mask-image:linear-gradient(180deg,#000 0%,#000 30%,transparent 62%)}.hero-bg img{object-position:70% 20%}.hero::before{background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.82) 35%,#fff 62%)}.hero-feats{grid-template-columns:1fr;gap:26px;margin-top:60px}.img-credit{position:static;margin-top:26px;padding:0 24px}}

section{padding:120px 0}
.sec-head{display:flex;flex-direction:column;gap:14px;margin-bottom:48px;max-width:760px}
.sec-head h2{font-size:clamp(28px,3.8vw,46px);font-weight:500;letter-spacing:-.03em}
.sec-head p{color:var(--muted);margin:0;font-size:17px;max-width:40em}
@media (max-width:640px){section{padding:84px 0}.sec-head{margin-bottom:32px}}

/* ===== 작업실형 웹앱 ===== */
.daw{background:#fff;border:1px solid var(--line-2);border-radius:20px;overflow:hidden;box-shadow:0 30px 80px rgba(91,64,214,.14),0 2px 6px rgba(28,25,51,.05)}
.transport{display:flex;align-items:center;gap:18px;padding:12px 16px;background:linear-gradient(180deg,var(--lav-100),var(--lav-50));border-bottom:1px solid var(--line);flex-wrap:wrap}
.tp-brand{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.tp-ctrl{display:flex;align-items:center;gap:6px}
.tp-btn{width:38px;height:38px;border-radius:10px;border:0;background:#fff;color:var(--ink);cursor:pointer;display:grid;place-items:center;font-size:14px;box-shadow:0 1px 3px rgba(28,25,51,.08)}
.tp-btn:hover{background:var(--lav-200)}
.tp-play{width:48px;height:48px;border-radius:50%;background:var(--violet);color:#fff;font-size:18px;box-shadow:0 0 0 6px rgba(109,77,255,.14),0 8px 20px rgba(109,77,255,.35)}
.tp-play:hover{background:var(--violet-2)}
.tp-play.on{background:var(--orchid);box-shadow:0 0 0 6px rgba(210,100,230,.16),0 8px 20px rgba(210,100,230,.35)}
.tp-text{height:38px;padding:0 12px;border-radius:10px;border:0;background:#fff;cursor:pointer;font-size:13px;font-weight:600;box-shadow:0 1px 3px rgba(28,25,51,.08)}
.tp-text:hover{background:var(--lav-200)}
.lcds{display:flex;gap:2px;background:#1c1933;border-radius:12px;padding:4px}
.lcd{display:flex;flex-direction:column;padding:2px 12px;min-width:86px}
.lcd span{font-size:10px;font-weight:600;letter-spacing:.08em;color:#8d89ad}
.lcd b{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600;color:#d9ceff;letter-spacing:.01em}
.tp-quota{margin-left:auto;display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.daw-grid{display:grid;grid-template-columns:210px minmax(0,1fr) 360px}
@media (max-width:1180px){.daw-grid{grid-template-columns:190px minmax(0,1fr)}.inspector{grid-column:1/-1;border-left:0!important;border-top:1px solid var(--line)}}
@media (max-width:760px){.daw-grid{grid-template-columns:minmax(0,1fr)}.tp-quota{margin-left:0}.browser{border-right:0!important;border-bottom:1px solid var(--line)}}
.browser{border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:10px;background:var(--lav-50)}
.browser h3{font-size:11px;letter-spacing:.06em;color:var(--dim);font-weight:700;margin-top:6px}
.song{text-align:left;background:transparent;border:0;border-radius:10px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;width:100%}
.song:hover{background:var(--lav-100)}
.song.active{background:#fff;box-shadow:0 1px 4px rgba(91,64,214,.14)}
.song b{font-size:13px;font-weight:600}
.song small{color:var(--muted);font-size:11px}
.upload{margin-top:4px;font-size:11px;color:var(--dim);line-height:1.5;padding:0 10px}
@media (max-width:760px){#songList{flex-direction:row!important;overflow-x:auto;padding-bottom:4px}.song{min-width:180px}}
.arrange{min-width:0;padding:0 0 14px;background:#fff}
.arr-scroll{overflow-x:auto}
.arr-inner{min-width:620px;position:relative}
.ruler{display:grid;height:36px;border-bottom:1px solid var(--line);font-family:var(--num);font-size:11px;color:var(--dim);background:var(--lav-50)}
.ruler .spacer{border-right:1px solid var(--line)}
.ruler .rb{position:relative;border-left:1px solid var(--line);padding:4px 6px;display:flex;flex-direction:column;line-height:1.2;cursor:pointer}
.ruler .rb.sel{color:var(--violet);font-weight:700}
.ruler .rb .sec{font-family:var(--body);font-size:10px;color:var(--violet);font-weight:700;white-space:nowrap}
.track{display:grid;border-bottom:1px solid var(--line)}
.th{border-right:1px solid var(--line);padding:10px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:4px;background:var(--lav-50)}
.th b{font-size:11px;letter-spacing:.04em;color:var(--ink)}
.th i{display:block;width:10px;height:10px;border-radius:3px;background:var(--violet)}
.lane{position:relative;display:grid;padding:8px 0}
.clip{position:relative;margin:0 3px;height:136px;border-radius:10px;border:0;cursor:pointer;text-align:left;padding:0;overflow:hidden;display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s}
.clip:hover{transform:translateY(-1px)}
.clip .cap{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:5px 8px;font-size:10px;font-weight:700;color:#2a2450}
.clip .cap span:last-child{font-family:var(--num)}
.clip .ch{font-size:20px;font-weight:700;padding:5px 9px 0;color:var(--ink);line-height:1.1}
.clip .tg{font-size:11px;padding:0 9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip .roll{position:absolute;left:7px;right:7px;bottom:8px;height:30px}
.clip .roll i{position:absolute;height:3px;border-radius:2px;opacity:.95}
.clip.sel{box-shadow:0 0 0 2px var(--violet) inset}
.clip.playing{box-shadow:0 0 0 2px var(--orchid) inset,0 6px 18px rgba(210,100,230,.3)}
.clip .dot{position:absolute;top:30px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--orchid)}
.c-T{background:linear-gradient(180deg,#f1ecff,#f8f6ff)}.c-T .cap{background:var(--f-T)}
.c-S{background:linear-gradient(180deg,#eceffe,#f7f8ff)}.c-S .cap{background:var(--f-S)}
.c-D{background:linear-gradient(180deg,#fcecfe,#fef7ff)}.c-D .cap{background:var(--f-D)}
.c-X{background:linear-gradient(180deg,#fff5da,#fffbef)}.c-X .cap{background:var(--f-X)}
.wave-lane{height:120px;padding:0;background:var(--lav-50)}
#wave{width:100%;height:120px;display:block;cursor:pointer}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--violet);box-shadow:0 0 10px rgba(109,77,255,.45);pointer-events:none;z-index:3;transition:left .06s linear}
.playhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--violet)}
.synth-note{font-size:11px;color:var(--dim);margin:10px 14px 0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:10px 14px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.inspector{border-left:1px solid var(--line);background:var(--lav-50);padding:14px 18px 20px;min-width:0}
.tabs{display:flex;gap:2px;background:var(--lav-100);border-radius:10px;padding:3px;margin-bottom:16px}
.tab{flex:1;background:none;border:0;border-radius:8px;padding:8px 6px;cursor:pointer;color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap}
.tab[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(28,25,51,.1)}
.seg{display:inline-flex;background:var(--lav-100);border-radius:8px;padding:3px;gap:2px}
.seg button{background:none;border:0;border-radius:6px;padding:5px 11px;cursor:pointer;color:var(--muted);font-weight:700;font-size:12px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(28,25,51,.1)}
.insp h4{font-size:14px;font-weight:700;margin:18px 0 6px}
.insp p{margin:4px 0;color:var(--muted);font-size:14px;line-height:1.6}
.insp p b{color:var(--ink)}
.insp .hint{font-size:12px;color:var(--dim)}
.insp .sel-chord{display:flex;align-items:baseline;gap:10px;margin-top:16px}
.insp .sel-chord .big{font-size:30px;font-weight:700;color:var(--ink)}
.insp .sel-chord .lab{font-size:12px;color:var(--violet);font-weight:700}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{background:transparent;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:13px;text-align:left;display:flex;align-items:center;gap:10px;width:100%}
.opt:hover{background:#fff}
.opt.on{background:#fff;box-shadow:0 0 0 1.5px var(--violet) inset}
.opt b{min-width:56px;color:var(--ink)}
.opt span{color:var(--ink)}
.opt small{margin-left:auto;color:var(--dim);font-size:11px;white-space:nowrap}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.diff-chart{display:grid;gap:5px;align-items:end;height:150px;padding:8px 0 0;border-bottom:1px solid var(--line);margin-top:14px;background:repeating-linear-gradient(to top,transparent 0 29px,rgba(91,64,214,.07) 29px 30px)}
.dcol{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;cursor:pointer;background:none;border:0;padding:0}
.dval{font-family:var(--num);font-size:10px;color:var(--muted)}
.dbar{width:72%;border-radius:4px 4px 0 0;min-height:4px}
.dlabels{display:grid;gap:5px;padding:6px 0 0;font-family:var(--num);font-size:10px;color:var(--dim);text-align:center}
.lock{display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:var(--lav-100);border-radius:12px;padding:14px;margin-top:14px;font-size:13px;color:var(--muted)}

/* pricing */
.trial-line{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px 26px;border-radius:18px;background:linear-gradient(90deg,var(--lav-100),#fdf3ff);margin-bottom:28px;font-size:16px;color:var(--muted)}
.trial-line b{color:var(--ink)}
.cycle{display:inline-flex;background:var(--lav-100);border-radius:999px;padding:4px;margin-bottom:36px}
.cycle button{background:none;border:0;border-radius:999px;padding:8px 18px;cursor:pointer;color:var(--muted);font-weight:700;font-size:14px}
.cycle button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(28,25,51,.1)}
.plans-main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:1000px){.plans-main{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.plans-main{grid-template-columns:1fr}}
.plan{border-radius:22px;padding:30px 26px;display:flex;flex-direction:column;gap:14px;background:var(--lav-50);border:1px solid var(--line)}
.plan.best{background:radial-gradient(120% 90% at 100% 0%,rgba(164,139,255,.35),transparent 60%),linear-gradient(180deg,#f3eeff,#ebe3ff);border:1.5px solid var(--lav-300);box-shadow:0 24px 60px rgba(109,77,255,.16)}
.plan h3{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px}
.plan .price{font-family:var(--num);font-size:clamp(34px,3.2vw,44px);font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:2px}
.plan .price small{font-family:var(--body);font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px;white-space:nowrap}
.plan .sub{color:var(--muted);font-size:14px;margin:0}
.plan ul{list-style:none;margin:10px 0 18px;padding:0;display:flex;flex-direction:column;gap:10px;font-size:15px;flex:1}
.plan li{padding-left:26px;position:relative}
.plan li::before{content:"";position:absolute;left:2px;top:.5em;width:10px;height:5px;border-left:2px solid var(--violet);border-bottom:2px solid var(--violet);transform:rotate(-45deg)}
.plan li.no{color:var(--dim)}.plan li.no::before{border:0;border-top:2px solid var(--dim);transform:none;top:.8em;height:0}
.plan .btn{align-self:stretch}
.plan:not(.best) .btn-ghost{background:#fff;box-shadow:0 0 0 1px var(--line-2) inset}

/* help */
.notice{display:flex;gap:12px;align-items:flex-start;background:#fff8e6;color:#6e4a00;border-radius:14px;padding:16px 18px;font-size:14px;margin-bottom:40px;max-width:900px}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px}
@media (max-width:820px){.help-grid{grid-template-columns:1fr;gap:40px}}
.help-grid h3{font-size:20px;font-weight:700;margin-bottom:8px}
.hrow{display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);font-size:15px}
.hrow .lb{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}
.hrow .vl{font-weight:600}
.hrow .vl small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}
.hrow .mono{font-family:var(--num)}
.vtag{font-size:10px;font-weight:700;color:#a06a00;background:#fff4d6;border-radius:4px;padding:0 6px;margin-left:8px;vertical-align:2px}
.nmark{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;background:#03c75a;color:#fff;font-weight:900;font-size:11px}
.kmark{display:inline-grid;place-items:center;height:18px;padding:0 4px;border-radius:4px;background:#fee500;color:#191600;font-weight:900;font-size:10px}
.bmark{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;background:var(--violet);color:#fff;font-weight:900;font-size:11px}
@media (max-width:480px){.hrow{grid-template-columns:1fr auto}.hrow .lb{grid-column:1/-1}}

/* orders & faq */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700}
.field input,.field select,.field textarea{background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:11px 13px;color:var(--ink)}
.field textarea{font-size:16px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 3px rgba(109,77,255,.14)}
.code-form{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px;max-width:640px}
.orders{display:flex;flex-direction:column}
.order{padding:14px 0;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:14px}
.order .oid{font-family:var(--num);font-weight:600}
.order .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{color:var(--muted);font-size:14px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.err{font-size:13px;color:var(--rose);min-height:1em}
.hint{font-size:12px;color:var(--dim)}
details{border-bottom:1px solid var(--line);padding:20px 0}
summary{cursor:pointer;font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--violet);font-size:20px;line-height:1}
details[open] summary::after{content:"–"}
details p{color:var(--muted);margin:10px 0 0;font-size:15px;max-width:52em}
footer{border-top:1px solid var(--line);padding:40px 0 56px;color:var(--dim);font-size:13px;background:var(--lav-50)}
footer .wrap-wide{display:flex;flex-direction:column;gap:6px}
footer b{color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(28,25,51,.32);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;padding:48px 16px;overflow-y:auto}
.modal.open{display:flex}
.sheet{background:#fff;border-radius:20px;width:100%;max-width:520px;box-shadow:0 40px 100px rgba(28,25,51,.25)}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line)}
.sheet header h3{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
.x{background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.sheet .body{padding:20px 22px 24px;display:flex;flex-direction:column;gap:16px}
.demo-bar{display:flex;gap:8px;align-items:center;font-size:13px;color:#6e4a00;background:#fff8e6;border-radius:10px;padding:10px 12px}
.summary{background:var(--lav-50);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.row .v{font-family:var(--num);font-variant-numeric:tabular-nums}
.row.total{border-top:1px solid var(--line);padding-top:10px;font-weight:700;font-size:18px}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.method{background:var(--lav-50);border:1.5px solid transparent;border-radius:14px;padding:13px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px}
.method[aria-checked="true"]{border-color:var(--violet);background:#fff}
.method b{display:flex;align-items:center;gap:8px;font-size:15px}
.method small{color:var(--muted);font-size:12px}
.acct{background:var(--lav-50);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.acct .num{font-size:17px;font-weight:600}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted)}
.done{display:flex;flex-direction:column;gap:12px}
.done .big{font-size:22px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:4px}
.chip{font-size:13px;background:var(--lav-100);border-radius:6px;padding:2px 8px}
.chip.bad{background:#ffe7ee;color:var(--rose)}
.auth-tabs{display:flex;gap:2px;background:var(--lav-100);border-radius:10px;padding:3px}
.auth-tabs button{flex:1;background:none;border:0;border-radius:8px;padding:9px;cursor:pointer;color:var(--muted);font-weight:700;font-size:14px}
.auth-tabs button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(28,25,51,.1)}
.linkish{background:none;border:0;color:var(--violet);cursor:pointer;font-size:13px;padding:0;text-decoration:underline}
.fab{position:fixed;right:20px;bottom:20px;z-index:30;background:#fff;color:var(--ink);font-weight:700;font-size:14px;text-decoration:none;padding:12px 18px;border-radius:999px;box-shadow:0 10px 28px rgba(91,64,214,.2),0 0 0 1px var(--line-2) inset}
.fab:hover{background:var(--lav-100)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
@media (max-width:760px){.clip{height:116px}.wave-lane{height:96px}#wave{height:96px}.transport{gap:12px}.lcd{min-width:70px}.hero-feats h3{font-size:20px}}
/* 브랜드 필름(멜로MR 쇼릴) */
.film{padding:56px 0 24px}
.film-card{display:grid;grid-template-columns:minmax(240px,1fr) 2.3fr;gap:clamp(24px,3.5vw,56px);align-items:center;padding:clamp(24px,4vw,56px);border-radius:28px;background:radial-gradient(120% 140% at 15% 0%,#1d2366 0%,#0b0e2e 55%,#05061a 100%);box-shadow:0 30px 80px rgba(28,25,51,.22)}
.film-head .eyebrow{color:var(--lav)}
.film-head h2{color:#fff;font-size:clamp(26px,3vw,40px);font-weight:600;letter-spacing:-.03em;margin:14px 0 12px}
.film-head h2 em{font-family:var(--serif);font-style:italic;font-weight:500;color:var(--lav)}
.film-head p{color:#cfc2ff;margin:0;font-size:16px;line-height:1.65}
.film-video{display:block;width:100%;aspect-ratio:16/9;border-radius:16px;background:#05061a;box-shadow:0 0 0 1px rgba(164,139,255,.28),0 24px 60px rgba(109,77,255,.28)}
@media (max-width:900px){.film-card{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

</head>

<section id="app">
  <div class="wrap-wide">
    <div class="sec-head">
      <div class="eyebrow" data-i18n="app.eyebrow"></div>

<div class="modal" id="custom" role="dialog" aria-modal="true" aria-labelledby="myTitleH">
  <div class="sheet">
    <header><h3 id="myTitleH" data-i18n="my.h"></h3><button class="x" type="button" data-close data-i18n-aria="co.close">×</button></header>
    <form class="body" id="customForm" novalidate>
      <div class="field"><label for="myTitle" data-i18n="my.titleL"></label><input id="myTitle" data-i18n-ph="my.titlePh" autocomplete="off"></div>
      <div class="field"><label for="myChords" data-i18n="my.chordsL"></label>
        <textarea id="myChords" rows="2" placeholder="C G Am F C G F G" autocomplete="off" spellcheck="false"></textarea>
        <span class="hint" data-i18n="my.chordsHint"></span></div>
      <div id="myPreview" class="chips" aria-live="polite"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="field"><label for="myKey" data-i18n="my.keyL"></label><select id="myKey"></select>
          <span class="hint" id="myKeyHint"></span></div>
        <div class="field"><label for="myBpm" data-i18n="my.bpmL"></label><input id="myBpm" type="number" inputmode="numeric" min="40" max="200" value="80"></div>
      </div>
      <div class="err" id="myErr"></div>
      <button class="btn btn-primary" type="submit" data-i18n="my.submit"></button>
      <p class="hint" style="margin:0" data-i18n="my.quota"></p>
    </form>
  </div>
</div>

/* ---------- 상태 (이 브라우저 전용) ---------- */

let state = load("state",{plan:"none",tickets:0});
if(!["pro","team"].includes(state.plan)) state.plan="none";
delete state.analysis; delete state.custom; delete state.edit;

function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),2600)}

/* ---------- 음악 엔진 ---------- */
const NOTE = {C:0,"C#":1,Db:1,D:2,"D#":3,Eb:3,E:4,F:5,"F#":6,Gb:6,G:7,"G#":8,Ab:8,A:9,"A#":10,Bb:10,B:11};
const NAMES = ["C","C#","D","Eb","E","F","F#","G","Ab","A","Bb","B"];
const QUAL = {"":[0,4,7],"m":[0,3,7],"7":[0,4,7,10],"maj7":[0,4,7,11],"m7":[0,3,7,10],"sus4":[0,5,7],"add9":[0,4,7,14],"dim":[0,3,6],"m7b5":[0,3,6,10]};
function parse(ch){const m=ch.match(/^([A-G][#b]?)(.*)$/);return {root:NOTE[m[1]],rootName:m[1],q:m[2]}}
function chordName(root,q){return NAMES[((root%12)+12)%12]+q}
const DEG = {0:["I","T"],2:["ii","S"],4:["iii","T"],5:["IV","S"],7:["V","D"],9:["vi","T"],11:["vii°","D"]};
const ROMAN_UP = {0:"I",2:"II",4:"III",5:"IV",7:"V",9:"VI",11:"VII"};
function analyze(ch,key){
  const {root,q}=parse(ch); const iv=(root-key+12)%12;
  const minorish = q.startsWith("m")&&!q.startsWith("maj");
  if(q==="7"){
    if(iv===7) return {rn:"V7",fn:"D",note:t("n.v7")};
    const target=(iv+5)%12;
    if(DEG[target]) return {rn:"V7/"+DEG[target][0],fn:"X",note:t("n.sec",{t:DEG[target][0]})};
  }
  if(DEG[iv]){
    const [r,fn]=DEG[iv];
    const expectMinor=[2,4,9].includes(iv);
    if(iv===11 ? (q==="dim"||q==="m7b5") : (expectMinor===minorish && q!=="dim" && q!=="m7b5")){
      let rn=r; if(q.includes("7")) rn+= q==="maj7"?"maj7":"7";
      if(q==="sus4") rn+="sus4"; if(q==="add9") rn+="add9";
      return {rn,fn,note:null};
    }
    const rn = minorish? r.toLowerCase(): ROMAN_UP[iv];
    return {rn:rn+(q.replace(/^m/,"")),fn:"X",note:t("n.bor")};
  }
  const flat={1:"♭II",3:"♭III",6:"♯IV",8:"♭VI",10:"♭VII"}[iv];
  return {rn:flat+(q||""),fn:"X",note:t("n.modal")};
}
function voicing(ch){const {root,q}=parse(ch);const iv=QUAL[q]||QUAL[""];const base=48+root;return iv.map(i=>base+i).map(n=>n>67?n-12:n)}
function bassNote(ch){return 36+parse(ch).root}
/* 한 마디의 음표 이벤트 (박 단위). 소리·피아노롤·파형이 모두 이것을 씁니다 */
function events(i){
  const notes=voicing(cur[i]), r=state.rhythm[i], ev=[];
  if(r==="whole") notes.forEach(n=>ev.push({t:0,d:4,n,v:.07}));
  if(r==="quarter") for(let b=0;b<4;b++) notes.forEach(n=>ev.push({t:b,d:.9,n,v:.06}));
  if(r==="arp"){const seq=[...notes,notes[1]+12,notes[0]+12,...notes.slice(1).reverse()];for(let k=0;k<8;k++)ev.push({t:k/2,d:.9,n:seq[k%seq.length],v:.08})}
  if(r==="sync") [[0,1.4],[1.5,.8],[2.5,.8],[3.5,.5]].forEach(([b,d])=>notes.forEach(n=>ev.push({t:b,d,n,v:.065})));
  return ev;
}

const BARRE = new Set(["F","Bm","F#m","B","Bb","C#m","Fmaj7","F#","Gm","Cm","Eb","Ab","Bm7","F#m7","C#m7","Bb7","B7"]);
function difficulty(chs,inst){
  return chs.map((c,i)=>{
    const {root,q}=parse(c); let s=1.5, why=[];
    if(inst==="guitar"){
      if(BARRE.has(c)){s+=4;why.push(t("w.barre",{c}))}
      if(q==="maj7"||q==="m7b5"){s+=1.5;why.push(t("w.seventh"))}
      if(q==="7"&&!["E","A","D","G","B","C"].includes(NAMES[root])){s+=1;why.push(t("w.dom"))}
    }else{
      const acc=voicing(c).filter(n=>[1,3,6,8,10].includes(n%12)).length;
      if(acc){s+=acc*1.2;why.push(t("w.black",{n:acc}))}
      if(QUAL[q]&&QUAL[q].length>3){s+=1.8;why.push(t("w.four"))}
    }
    if(i>0){const pr=parse(chs[i-1]).root;const d=Math.min((root-pr+12)%12,(pr-root+12)%12);
      if(d>=5){s+=1.6;why.push(t("w.jump",{a:chs[i-1],b:c}))}}
    if(state.rhythm[i]==="sync"){s+=1.2;why.push(t("w.sync"))}
    return {score:Math.min(10,Math.round(s*10)/10),why};
  });
}

const SONGS = [
  {id:"ballad",key:0,bpm:76,sec:[0,4],chords:["C","G","Am","F","C","G","F","G"]},
  {id:"canon",key:2,bpm:64,sec:[0,4],chords:["D","A","Bm","F#m","G","D","G","A"]},
  {id:"jazz",key:0,bpm:96,sec:[0,4],chords:["Dm7","G7","Cmaj7","Cmaj7","Em7","A7","Dm7","G7"]}

function songView(s){
  if(s.id!=="custom"){
    const secs=st(s.id,"sections");
    return {title:st(s.id,"title"),desc:st(s.id,"desc"),sections:s.sec.map((p,i)=>[p,secs[i]]),easy:st(s.id,"easy"),story:st(s.id,"story")};
  }

  return {
    title: s.name? t("c.title",{t:s.name}) : t("c.defName"),

    sections: n>4? [[0,t("c.first")],[4,t("c.second")]] : [[0,t("c.all")]],

  };
}
function suggestions(ch,key){
  const {root,q}=parse(ch); const iv=(root-key+12)%12; const out=[];
  const add=(c,e,term)=>{if(c!==ch&&!out.find(o=>o.c===c))out.push({c,easy:t(e),term:term.startsWith("st.")?t(term):term})};
  if(iv===0){add(chordName(key+9,"m"),"s.lyrical","st.relmin");add(chordName(key+4,"m"),"s.dreamy","iii");add(chordName(root,"maj7"),"s.urban","Imaj7")}
  if(iv===5){add(chordName(key+2,"m7"),"s.softer","ii7");add(chordName(key+5,"m"),"s.wistful","st.bor");add(chordName(root,"add9"),"s.open","add9")}
  if(iv===7){add(chordName(root,"sus4"),"s.hold","sus4");add(chordName(root,"7"),"s.release","V7");add(chordName(key+10,""),"s.rock","♭VII")}
  if(iv===9){add(chordName(key,""),"s.bright","I");add(chordName(key+4,"7"),"s.pullVi","V7/vi");add(chordName(root,"m7"),"s.smooth","vi7")}
  if(iv===2){add(chordName(key+5,""),"s.brighter","IV");add(chordName(key+9,"7"),"s.pullFront","V7/ii")}
  if(iv===4){add(chordName(key,""),"s.stable","I");add(chordName(key+9,"7"),"s.pullNext","V7/ii")}
  if(q==="7"&&iv!==7){add(chordName(root+6,"7"),"s.slide","st.tri")}
  if(out.length<3){add(chordName(root,q==="m"||q==="m7"?"m7":"maj7"),"s.color","st.seventh");add(chordName(root,"sus4"),"s.float","sus4");add(chordName(root,""),"s.plain","st.triad")}
  return out.slice(0,5);
}

function easyOf(chs,i,key){
  const c=chs[i], a=analyze(c,key), {root}=parse(c), iv=(root-key+12)%12;
  if(a.rn.startsWith("V7/")){
    const tt=(iv+5)%12, tq=[2,4,9].includes(tt)?"m":"", target=chordName(key+tt,tq);

    return {tag:t("esec.tag"), line:t("esec.line",{t:target})+(hit?t("esec.hit",{c:next}):"")};
  }
  if(a.fn==="X") return {tag:t("ebor.tag"), line:t("ebor.line")};
  return {tag:t(`e${iv}.tag`), line:t(`e${iv}.line`)};
}
function moments(chs,key){
  const out=[]; const ivOf=c=>(parse(c).root-key+12)%12;
  chs.forEach((c,i)=>{
    const a=analyze(c,key), iv=ivOf(c), prev=chs[i-1];
    if(a.fn==="X") out.push(t("m.x",{n:i+1,c:esc(c)}));
    else if(prev && iv===9 && [0,5,7].includes(ivOf(prev)) && analyze(prev,key).fn!=="X") out.push(t("m.sad",{n:i+1,c:esc(c),p:esc(prev)}));
    else if(prev && iv===0 && ivOf(prev)===7) out.push(t("m.res",{a:i,b:i+1,p:esc(prev),c:esc(c)}));
  });
  const last=chs[chs.length-1], liv=ivOf(last);
  if(liv===7) out.push(t("m.endV",{c:esc(last)}));
  else if(liv===0) out.push(t("m.endI",{c:esc(last)}));
  return out.slice(0,4);
}

function hash(x){const s=Math.sin(x*127.1)*43758.5453;return s-Math.floor(s)}
function drawWave(){
  const cv=document.getElementById("wave"); const w=cv.clientWidth, h=cv.clientHeight; if(!w) return;
  const dpr=Math.min(2,window.devicePixelRatio||1); if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  const n=cur.length, bw=w/n, mid=h/2;
  g.fillStyle="rgba(109,77,255,.09)"; g.fillRect(sel*bw,0,bw,h);
  const evs=cur.map((c,i)=>events(i));
  const grad=g.createLinearGradient(0,0,w,0); grad.addColorStop(0,"#6d4dff"); grad.addColorStop(.55,"#9a7bff"); grad.addColorStop(1,"#d264e6");
  const prog=(playing?playPos:-1)*bw;
  for(let x=0;x<w;x+=3){
    const b=Math.min(n-1,Math.floor(x/bw)), tb=(x/bw-b)*4;
    let amp=Math.exp(-tb*0.5)*0.35; // 베이스
    for(const e of evs[b]){ if(tb>=e.t){ const dt=tb-e.t; amp+= (dt<=e.d? Math.exp(-dt*1.6) : Math.exp(-e.d*1.6)*Math.exp(-(dt-e.d)*6)) * e.v*4.2 } }
    amp=Math.min(1,amp)*(0.55+0.45*hash(x*0.37+b));
    const hh=Math.max(1.5,amp*(mid-6));
    g.fillStyle = x<prog? grad : "rgba(109,77,255,.32)";
    g.fillRect(x,mid-hh,2,hh*2);
  }
  g.fillStyle="rgba(91,64,214,.12)"; for(let i=1;i<n;i++) g.fillRect(Math.round(i*bw),0,1,h);
}

function ctx(){if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;audio=new AC()}if(audio.state==="suspended")audio.resume();return audio}
const hz=m=>440*Math.pow(2,(m-69)/12);
function tone(ac,m,tm,dur,vol,type){const o=ac.createOscillator(),g=ac.createGain();o.type=type||"triangle";o.frequency.value=hz(m);
  g.gain.setValueAtTime(0,tm);g.gain.linearRampToValueAtTime(vol,tm+0.02);g.gain.exponentialRampToValueAtTime(0.0008,tm+dur);o.connect(g).connect(ac.destination);o.start(tm);o.stop(tm+dur+0.05)}
function scheduleBar(ac,i,t0,beat){
  tone(ac,bassNote(cur[i]),t0,beat*4,0.16,"sine");
  events(i).forEach(e=>tone(ac,e.n,t0+e.t*beat,e.d*beat*(e.d>=4?1:1),e.v));
}

function stop(){
  playing=false; cancelAnimationFrame(rafId);
  document.querySelectorAll(".clip.playing").forEach(b=>b.classList.remove("playing"));
  if(audio){audio.close();audio=null}
  const pb=document.getElementById("playBtn"); pb.textContent="▶"; pb.classList.remove("on"); pb.setAttribute("aria-label",t("btn.play"));
  playPos=sel; setPlayhead(playPos); drawWave();
}
function frame(){
  if(!playing||!audio) return;
  const beat=60/song.bpm, pos=(audio.currentTime-playStart)/(beat*4);
  if(pos>=cur.length){stop();return}
  playPos=Math.max(0,pos); setPlayhead(playPos); drawWave();
  const bi=Math.floor(playPos); document.querySelectorAll(".clip").forEach(b=>b.classList.toggle("playing",+b.dataset.i===bi));
  rafId=requestAnimationFrame(frame);
}
function play(){
  const ac=ctx(); if(!ac){toast(t("t.noAudio"));return}
  playing=true; const beat=60/song.bpm; playStart=ac.currentTime+0.1;
  cur.forEach((c,i)=>scheduleBar(ac,i,playStart+i*beat*4,beat));
  const pb=document.getElementById("playBtn"); pb.textContent="■"; pb.classList.add("on"); pb.setAttribute("aria-label",t("btn.stop"));

/* ---------- 내 곡 코드 입력 ---------- */
const CHORD_RE=/^([A-G][#b]?)(maj7|m7b5|m7|sus4|add9|dim|m|7)?$/;
function normChord(raw){
  let s=raw.trim(); if(!s) return null;
  s=s.replace(/♯/g,"#").replace(/♭/g,"b");
  s=s.charAt(0).toUpperCase()+s.slice(1);
  let slash=false; if(s.includes("/")){s=s.split("/")[0];slash=true}
  s=s.replace(/^([A-G][#b]?)(M7|Maj7|maj)$/,"$1maj7").replace(/^([A-G][#b]?)min$/,"$1m").replace(/^([A-G][#b]?)-$/,"$1m").replace(/^([A-G][#b]?)ø$/,"$1m7b5");
  return CHORD_RE.test(s)?{c:s,slash}:{bad:raw.trim()};
}
function parseProgression(text){
  const toks=text.split(/[\s,|]+/).filter(Boolean);
  const chords=[],bad=[];let slash=false;
  toks.forEach(x=>{const r=normChord(x);if(!r)return;if(r.bad)bad.push(r.bad);else{chords.push(r.c);if(r.slash)slash=true}});
  return {chords,bad,slash};
}
function isDiatonic(ch,k){
  const {root,q}=parse(ch), iv=(root-k+12)%12; if(!DEG[iv]) return false;
  const minorish=q.startsWith("m")&&!q.startsWith("maj");
  if(iv===11) return q==="dim"||q==="m7b5";
  if(q==="7") return iv===7;
  return [2,4,9].includes(iv)===minorish && q!=="dim" && q!=="m7b5";
}
function detectKey(chs){
  let best=parse(chs[0]).root, bestS=-1;
  for(let k=0;k<12;k++){
    let s=0; chs.forEach(c=>{if(isDiatonic(c,k))s+=2});
    if(parse(chs[0]).root===k) s+=1.5; if(parse(chs[chs.length-1]).root===k) s+=1.5;
    if(s>bestS){bestS=s;best=k}
  }
  return best;
}
const KEY_ORDER=[0,7,2,9,4,5,10,3,8,1,6,11];
function fillKeySelect(){
  const sel=document.getElementById("myKey"), v=sel.value||"auto";
  sel.innerHTML=`<option value="auto">${t("my.auto")}</option>`+KEY_ORDER.map(k=>`<option value="${k}">${t("my.keyOpt",{k:NAMES[k]})}</option>`).join("");

}

/* ---------- 모달 ---------- */
let lastFocus=null;
function openModal(id){lastFocus=document.activeElement;const m=document.getElementById(id);m.classList.add("open");const f=m.querySelector("button,input");f&&f.focus()}
function closeModal(m){m.classList.remove("open");lastFocus&&lastFocus.focus&&lastFocus.focus()}
document.querySelectorAll(".modal").forEach(m=>{m.addEventListener("click",e=>{if(e.target===m||e.target.closest("[data-close]"))closeModal(m)})});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".modal.open").forEach(closeModal)});
document.getElementById("upGo").onclick=()=>{closeModal(document.getElementById("upsell"));openCheckout("pro")};
document.getElementById("upTicket").onclick=()=>{closeModal(document.getElementById("upsell"));openCheckout("ticket10")};

/* ---------- 결제창 (데모) ---------- */
let co={plan:"pro",cycle:"month",method:"smartstore"}, coView="form", coOrder=null, coOkPlan="";
function coPrice(){const p=PLANS.find(x=>x.id===co.plan);return p.once?p.month:(p[co.cycle]??p.month)}
function productKey(){return co.plan==="ticket10"?"ticket10":`${co.plan}_${co.cycle}`}
function openCheckout(plan){if(!user){openAuth("signup",()=>openCheckout(plan));return} co={plan,cycle:PLANS.find(p=>p.id===plan).once?"once":cycle,method:"smartstore"};coView="form";renderCheckout();openModal("checkout")}
function renderCheckout(){
  if(coView==="bank") return showBankDone(coOrder);
  if(coView==="ok") return showDone(coOkPlan);
  const p=PLANS.find(x=>x.id===co.plan), price=coPrice();
  const body=document.getElementById("coBody");
  const keep={};["bkName","bkEmail","bkReceipt","bkReceiptNo","ssCode"].forEach(id=>{const el=document.getElementById(id);if(el)keep[id]=el.value});
  const keepAgree=document.getElementById("bkAgree")?.checked;
  body.innerHTML=`
    <div class="demo-bar"><span class="demo-tag">${t("daw.demo")}</span>${t("co.demoBar")}</div>
    <div class="summary">
      <div class="row"><span>${t("co.product")}</span><b>${t("co.productName",{p:planName(p.id)})}</b></div>
      <div class="row"><span>${t("co.cycle")}</span><span>${p.once?t("co.once"):`<select id="coCycle" aria-label="${t("co.cycle")}" style="background:#fff;border:1px solid var(--line-2);border-radius:8px;padding:4px 8px"><option value="month"${co.cycle==="month"?" selected":""}>${t("co.monthOpt",{p:won(p.month)})}</option><option value="season"${co.cycle==="season"?" selected":""}>${t("co.seasonOpt",{p:won(p.season)})}</option><option value="year"${co.cycle==="year"?" selected":""}>${t("co.yearOpt",{p:won(p.year)})}</option></select>`}</span></div>
      <div class="row total"><span>${t("co.total")}</span><span class="v">${won(price)}</span></div>
    </div>
    <div>
      <div style="font-size:13px;font-weight:700;margin-bottom:8px" id="mLabel">${t("co.method")}</div>
      <div class="methods" role="radiogroup" aria-labelledby="mLabel">
        <button type="button" class="method" role="radio" aria-checked="${co.method==="smartstore"}" data-m="smartstore"><b><span class="nmark">N</span>${t("co.ss")}</b><small>${t("co.ssSub")}</small></button>
        <button type="button" class="method" role="radio" aria-checked="${co.method==="bank"}" data-m="bank"><b><span class="bmark">₩</span>${t("co.bank")}</b><small>${t("co.bankSub")}</small></button>
      </div>
    </div>
    <div id="coMethod"></div>`;
  const sel=body.querySelector("#coCycle"); if(sel) sel.onchange=()=>{co.cycle=sel.value;renderCheckout()};
  body.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{co.method=b.dataset.m;renderCheckout()});
  const m=body.querySelector("#coMethod");
  if(co.method==="smartstore"){
    const live=STORE.smartstoreLive, url=`${STORE.smartstoreBase}/${STORE.products[productKey()]}`;
    m.innerHTML=`<div style="display:flex;flex-direction:column;gap:12px">
      <p class="hint" style="margin:0;font-size:13px;color:var(--muted)">${t("co.ssInfo")}</p>
      ${live?`<a class="btn btn-primary" id="ssGo" href="${url}" target="_blank" rel="noopener">${t("co.ssBtn",{p:won(price)})}</a>`:`<button class="btn btn-primary" type="button" id="ssGo">${t("co.ssBtn",{p:won(price)})}</button>`}
      <div class="field"><label for="ssCode">${t("co.codeL")}</label><input id="ssCode" placeholder="MELO-XXXX-XXXX" autocomplete="off"></div>
      <div class="err" id="ssErr"></div>
      <button class="btn btn-ghost" type="button" id="ssRedeem">${t("co.redeem")}</button>
      <p class="hint" style="margin:0">${t("co.demo")}</p></div>`;
    if(keep.ssCode) m.querySelector("#ssCode").value=keep.ssCode;
    m.querySelector("#ssGo").onclick=()=>{addOrder({method:"smartstore",status:"store"}); if(!live) toast(t("t.ssDemo")); else toast(t("t.ssGo"))};
    m.querySelector("#ssRedeem").onclick=()=>{const r=redeem(m.querySelector("#ssCode").value);m.querySelector("#ssErr").textContent=r.err||"";if(r.ok){coOkPlan=r.plan;coView="ok";showDone(r.plan)}};
  }else{
    m.innerHTML=`<form id="bankForm" novalidate style="display:flex;flex-direction:column;gap:12px">
      <div class="field"><label for="bkName">${t("co.bkName")}</label><input id="bkName" autocomplete="name" placeholder="${t("co.bkNamePh")}"></div>
      <div class="field"><label for="bkEmail">${t("co.bkEmail")}</label><input id="bkEmail" type="email" autocomplete="email" placeholder="${t("co.bkEmailPh")}"></div>
      <div class="field"><label for="bkReceipt">${t("co.receipt")}</label><select id="bkReceipt"><option value="none">${t("co.rNone")}</option><option value="personal">${t("co.rPersonal")}</option><option value="biz">${t("co.rBiz")}</option></select></div>
      <div class="field" id="bkReceiptNoWrap" hidden><label for="bkReceiptNo">${t("co.rNo")}</label><input id="bkReceiptNo" inputmode="numeric" placeholder="${t("co.rNoPh")}"></div>
      <label class="check"><input type="checkbox" id="bkAgree"> ${t("co.agree")}</label>
      <div class="err" id="bkErr"></div>
      <button class="btn btn-primary" type="submit">${t("co.bkBtn",{p:won(price)})}</button></form>`;
    ["bkName","bkEmail","bkReceipt","bkReceiptNo"].forEach(id=>{if(keep[id]!=null)m.querySelector("#"+id).value=keep[id]});
    if(keepAgree) m.querySelector("#bkAgree").checked=true;
    const rc=m.querySelector("#bkReceipt");const syncR=()=>{m.querySelector("#bkReceiptNoWrap").hidden=rc.value==="none"};rc.onchange=syncR;syncR();
    m.querySelector("#bankForm").onsubmit=e=>{e.preventDefault();
      const name=m.querySelector("#bkName").value.trim(), email=m.querySelector("#bkEmail").value.trim(), err=m.querySelector("#bkErr");
      if(!name){err.textContent=t("e.name");return}
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){err.textContent=t("e.email");return}
      if(rc.value!=="none"&&!/^\d{9,13}$/.test(m.querySelector("#bkReceiptNo").value.replace(/-/g,""))){err.textContent=t("e.receipt");return}
      if(!m.querySelector("#bkAgree").checked){err.textContent=t("e.agree");return}
      coOrder=addOrder({method:"bank",status:"wait",name,email}); coView="bank";
      showBankDone(coOrder);
    };
  }
}
function fmtDate(ms){return new Date(ms).toLocaleString(LOCALE[lang],{month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"})}
function showBankDone(o){
  const body=document.getElementById("coBody");
  body.innerHTML=`<div class="done">
    <span class="pill wait" style="align-self:flex-start">${t("st.wait")}</span>
    <div class="big">${t("dn.h")}</div>
    <p style="margin:0;color:var(--muted);font-size:14px">${t("dn.msg",{d:fmtDate(o.due),n:esc(o.name)})}</p>
    <div class="demo-bar"><span class="demo-tag">${t("daw.demo")}</span>${t("dn.sample")}</div>
    <div class="acct">
      <div class="row"><span>${t("dn.oid")}</span><span style="font-family:var(--mono)">${o.id}</span></div>
      <div class="row"><span>${t("dn.amt")}</span><b>${won(o.amount)}</b></div>
      <div class="row"><span>${t("dn.bank")}</span><span>${t("bank.name")}</span></div>
      <div class="row"><span>${t("dn.acct")}</span><span class="num">${STORE.bank.number}</span></div>
      <div class="row"><span>${t("dn.holder")}</span><span>${STORE.bank.holder}</span></div>
    </div>
    <a class="btn btn-primary" href="#orders" data-close>${t("dn.orders")}</a>
    <p class="hint" style="margin:0">${t("dn.contact",{p:STORE.phone,k:STORE.kakaoId})}</p></div>`;
  renderOrders();
}
function showDone(planId){
  document.getElementById("coBody").innerHTML=`<div class="done"><span class="pill ok" style="align-self:flex-start">${t("ok.badge")} · ${t("daw.demo")}</span><div class="big">${t("ok.h")}</div><p style="margin:0;color:var(--muted)">${t("ok.msg",{l:planName(planId)})}</p><a class="btn btn-primary" href="#app" data-close>${t("ok.btn")}</a></div>`;
}
function copy(x){try{navigator.clipboard.writeText(x).then(()=>toast(t("t.copied",{t:x})),()=>toast(t("t.copyFail")))}catch(e){toast(t("t.copyFail"))}}

function addOrder(extra){
  const d=new Date(), id="DEMO-"+d.toISOString().slice(2,10).replace(/-/g,"")+"-"+Math.random().toString(36).slice(2,6).toUpperCase();
  const o={id,plan:co.plan,cycle:co.cycle,amount:coPrice(),created:d.getTime(),due:d.getTime()+86400000,...extra};
  orders.unshift(o);save("orders",orders);renderOrders();return o;
}
const CODES={"MELO-PRO1-2026":"pro","MELO-TEAM-2026":"team","MELO-T5-2026":"ticket10"};
const TICKET_SONGS=5;
function redeem(raw){
  const code=raw.trim().toUpperCase();
  if(!code) return {err:t("code.empty")};
  const used=load("usedCodes",[]);
  if(used.includes(code)) return {err:t("code.used")};
  if(!CODES[code]) return {err:t("code.bad")};
  const plan=CODES[code];
  if(plan==="ticket10") state.tickets+=TICKET_SONGS; else state.plan=plan;
  used.push(code);save("usedCodes",used);save("state",state);
  orders.unshift({id:"DEMO-SS-"+code.slice(5),plan,amount:PLANS.find(p=>p.id===plan).month,created:Date.now(),method:"smartstore",status:"done"});
  save("orders",orders);renderAll();renderPlans();renderOrders();toast(t("t.applied",{l:planName(plan)}));
  return {ok:true,plan};
}
function activate(o){o.status="done";if(o.plan==="ticket10")state.tickets+=TICKET_SONGS;else state.plan=o.plan;save("state",state);save("orders",orders);renderAll();renderPlans();renderOrders();toast(t("t.opened",{l:planName(o.plan)}))}
function renderOrders(){
  const el=document.getElementById("orderList");
  if(!orders.length){el.innerHTML=`<div class="empty">${t("ord.empty")}</div>`;return}
  el.innerHTML=orders.map((o,i)=>{
    const s=o.status==="done"?`<span class="pill ok">${t("st.done")}</span>`:o.status==="wait"?`<span class="pill wait">${t("st.wait")}</span>`:`<span class="pill">${t("st.store")}</span>`;
    const via=o.method==="bank"?t("via.bank"):t("via.ss");
    const act=o.status==="wait"?`<button class="btn btn-ghost btn-sm" type="button" data-admin="${i}" title="${t("ord.adminT")}">${t("ord.admin")}</button>`:"";
    const cyc=["year","month","season"].includes(o.cycle)?t("cyc."+o.cycle):"";
    return `<div class="order"><span class="oid">${o.id}</span><span>${planName(o.plan)}${cyc}</span><span>${won(o.amount)}</span><span style="color:var(--muted)">${via}</span><div class="sp">${s}${act}</div></div>`}).join("");
  el.querySelectorAll("[data-admin]").forEach(b=>b.onclick=()=>activate(orders[+b.dataset.admin]));
}
document.getElementById("codeForm").onsubmit=e=>{e.preventDefault();if(!user){openAuth("login");return}const r=redeem(document.getElementById("codeInput").value);document.getElementById("codeErr").textContent=r.err||"";if(r.ok)document.getElementById("codeInput").value=""};

/* ---------- 고객센터 (가상 정보) ---------- */
function renderSupport(){
  document.getElementById("supPhone").textContent=STORE.phone;
  document.getElementById("supKakao").textContent=STORE.kakaoId;
  document.getElementById("supKakaoHours").textContent=t("sup.kakaoHours");
  document.getElementById("supEmail").textContent=STORE.supportEmail;
}
document.getElementById("supCopyPhone").onclick=()=>copy(STORE.phone);
document.getElementById("supCopyKakao").onclick=()=>copy(STORE.kakaoId);

/* ---------- 로그인 · 회원가입 (데모) ---------- */
let authMode="signup", authNext=null;
function renderAuth(){
  const el=document.getElementById("authArea");
  if(user&&acct()){
    el.innerHTML=`<span class="who">${esc(acct().name)}</span><span class="pill${isPro()?" pro":""}">${statusLabel()}</span><button class="btn btn-ghost btn-sm" type="button" id="logoutBtn">${t("nav.logout")}</button>`;
    el.querySelector("#logoutBtn").onclick=()=>{user=null;save("user",null);toast(t("t.bye"));renderAll();renderPlans()};
  }else{
    el.innerHTML=`<button class="btn btn-ghost btn-sm" type="button" id="loginBtn">${t("nav.login")}</button><button class="btn btn-primary btn-sm" type="button" id="trialBtn">${t("nav.trial")}</button>`;
    el.querySelector("#loginBtn").onclick=()=>openAuth("login");
    el.querySelector("#trialBtn").onclick=()=>openAuth("signup");
  }
}
function setAuthMode(m){
  authMode=m;
  document.querySelectorAll("[data-auth]").forEach(b=>b.setAttribute("aria-selected",b.dataset.auth===m));
  document.getElementById("authTitleText").textContent=t(m==="signup"?"auth.signup":"auth.login");
  document.getElementById("fName").hidden=m!=="signup"; document.getElementById("fAgree").hidden=m!=="signup";
  document.getElementById("auPw").autocomplete=m==="signup"?"new-password":"current-password";
  document.getElementById("auSubmit").textContent=t(m==="signup"?"auth.signupBtn":"auth.loginBtn");
  document.getElementById("auSwitch").textContent=t(m==="signup"?"auth.toLogin":"auth.toSignup");
  document.getElementById("auErr").textContent="";
}
function openAuth(m,next){authNext=next||null;setAuthMode(m);openModal("auth");document.getElementById(m==="signup"?"auName":"auEmail").focus()}
document.querySelectorAll("[data-auth]").forEach(b=>b.onclick=()=>setAuthMode(b.dataset.auth));
document.getElementById("auSwitch").onclick=()=>setAuthMode(authMode==="signup"?"login":"signup");
document.getElementById("authForm").onsubmit=e=>{
  e.preventDefault();
  const err=document.getElementById("auErr"), name=document.getElementById("auName").value.trim();
  const email=document.getElementById("auEmail").value.trim().toLowerCase(), pw=document.getElementById("auPw").value;
  if(authMode==="signup"&&!name){err.textContent=t("auth.eName");return}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){err.textContent=t("e.email");return}
  if(pw.length<8){err.textContent=t("auth.ePw");return}
  if(authMode==="signup"){
    if(!document.getElementById("auAgree").checked){err.textContent=t("auth.eAgree");return}
    if(accounts[email]){err.textContent=t("auth.eExists");setAuthMode("login");document.getElementById("auEmail").value=email;return}
    accounts[email]={name,trialEnd:Date.now()+TRIAL_MS}; save("accounts",accounts);
    user=email; save("user",user); toast(t("t.welcome",{n:name}));
  }else{
    if(!accounts[email]){err.textContent=t("auth.eNo");return}
    user=email; save("user",user); toast(t("t.hello",{n:accounts[email].name}));
  }
  document.getElementById("auPw").value="";
  closeModal(document.getElementById("auth")); renderAll(); renderPlans();
  const nx=authNext; authNext=null; if(nx) nx();
};
document.querySelectorAll("[data-trial]").forEach(b=>b.onclick=()=>{
  if(!user) return openAuth("signup");
  document.getElementById(trialLeft()>0?"app":"pricing").scrollIntoView({behavior:"smooth"});
});
setInterval(()=>{ if(user) updateQuota() },60000);

/* ---------- 내비 ---------- */
const nav=document.getElementById("nav");
function navState(){nav.classList.toggle("solid",scrollY>40)}
addEventListener("scroll",navState,{passive:true}); navState();

/* ---------- 언어 적용 ---------- */
function applyLang(){
  document.documentElement.lang=HTML_LANG[lang];
  document.title=t("doc.title");
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.innerHTML=t(el.dataset.i18n)});
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{el.placeholder=t(el.dataset.i18nPh)});
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>{el.setAttribute("aria-label",t(el.dataset.i18nAria))});
  document.querySelectorAll("[data-i18n-alt]").forEach(el=>{el.alt=t(el.dataset.i18nAlt)});
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  fillKeySelect(); renderSupport(); renderAll(); renderPlans(); renderOrders();
  if(document.getElementById("custom").classList.contains("open")) previewCustom();
  if(document.getElementById("checkout").classList.contains("open")) renderCheckout();
  if(document.getElementById("upsell").classList.contains("open")) fillUpsell();
  if(document.getElementById("auth").classList.contains("open")) setAuthMode(authMode);
}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;save("lang",lang);applyLang()});

/* 시작 */
applyLang();

</script>
</body>
